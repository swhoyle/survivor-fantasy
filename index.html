<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Survivor fantasy players</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 960px; margin: 48px auto; padding: 0 20px; color: #173c37; background: #f7faf8; }
    h1 { margin-bottom: 8px; } p { line-height: 1.5; }
    button { margin: 16px 0; }
    button { padding: 12px 18px; border: 0; border-radius: 6px; background: #205c4e; color: white; cursor: pointer; }
    button:disabled { opacity: .6; } #status { min-height: 24px; } .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; background: white; } th, td { padding: 12px; border-bottom: 1px solid #dce6e0; text-align: left; white-space: pre-wrap; } th { background: #e7f0ea; }
  </style>
</head>
<body>
  <h1>Survivor fantasy</h1>
  <h2>Players</h2>
  <button id="refresh" type="button">Refresh</button>
  <p id="status" role="status">Loading players…</p>
  <div class="table-wrap"><table id="data"></table></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
